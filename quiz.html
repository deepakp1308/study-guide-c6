<style>

  .option:hover { border-color: #2a5f8f; background: #f0f4ff; }

  .option.wrong { border-color: #c62828; background: #ffebee; }

  .tf-btns button {

    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: white;
    transition: all 0.2s;
  }
  .tf-btns button:hover { border-color: #2a5f8f; }
  .tf-btns button.correct { border-color: #2d8a4e; background: #e8f5e9; }
  .tf-btns button.wrong { border-color: #c62828; background: #ffebee; }
  .freeform-area {
    width: 100%;

    font-size: 14px;

  }
  .explanation {
    margin-top: 12px;
    padding: 12px 16px;

    border-radius: 4px;
    font-size: 14px;
    display: none;
  }
  .explanation.show { display: block; }
  .nav-btns {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
  }
  .nav-btns button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-next { background: #2a5f8f; color: white; }
  .btn-next:hover { background: #1a3c5e; }
  .btn-reveal { background: #e0e0e0; color: #333; }
  .btn-reveal:hover { background: #d0d0d0; }
  .results-card {
    background: white;
    border-radius: 12px;
    padding: 32px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);

  }
  .results-card h2 { font-size: 28px; margin-bottom: 8px; }
  .results-card .score-big {
    font-size: 64px;
    font-weight: 700;
    color: #2a5f8f;
    margin: 16px 0;
  }
  .results-card .grade { font-size: 18px; margin-bottom: 24px; }
  .btn-restart {
    padding: 12px 32px;
    background: #2a5f8f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>

": "mcq", "question": "What is the definition of <b>Oxidation (oxygen)</b>?", "options": ["The charge (or effective charge) on an element in a compound; shown by Roman numerals for transition metals", "The theory that reactions only occur when particles collide with sufficient energy (at least the activation energy)", "A chemical reaction in which a substance reacts with oxygen; the reaction is exothermic", "The gain of oxygen by an element or compound"], "correct": 3, "explanation": "The gain of oxygen by an element or compound"}, {"id": "term_8", "type": "mcq", "question": "What is the definition of <b>Reduction (oxygen)</b>?", "options": ["The gain of oxygen by an element or compound", "The gain of electrons by an atom, ion, or molecule", "The minimum energy that colliding particles must have for a successful reaction to occur", "The loss of oxygen from a compound"], "correct": 3, "explanation": "The loss of oxygen from a compound"}, {"id": "term_9", "type": "mcq", "question": "What is the definition of <b>Oxidation (electrons)</b>?", "options": ["The minimum energy that colliding particles must have for a successful reaction to occur", "A chemical reaction in which a substance reacts with oxygen; the reaction is exothermic", "The loss of electrons by an atom, ion, or molecule", "The gain of oxygen by an element or compound"], "correct": 2, "explanation": "The loss of electrons by an atom, ion, or molecule"}, {"id": "term_10", "type": "mcq", "question": "What is the definition of <b>Reduction (electrons)</b>?", "options": ["The gain of electrons by an atom, ion, or molecule", "The minimum energy that colliding particles must have for a successful reaction to occur", "A reaction involving simultaneous oxidation and reduction", "The theory that reactions only occur when particles collide with sufficient energy (at least the activation energy)"], "correct": 0, "explanation": "The gain of electrons by an atom, ion, or molecule"}, {"id": "term_11", "type": "mcq", "question": "What is the definition of <b>Redox reaction</b>?", "options": ["A reaction involving simultaneous oxidation and reduction", "The loss of electrons by an atom, ion, or molecule", "The gain of oxygen by an element or compound", "A reaction in which a more reactive element displaces a less reactive element from a solution of its compound"], "correct": 0, "explanation": "A reaction involving simultaneous oxidation and reduction"}, {"id": "term_12", "type": "mcq", "question": "What is the definition of <b>Displacement reaction</b>?", "options": ["The loss of oxygen from a compound", "Oxidation Is Loss, Reduction Is Gain (of electrons)", "A reaction in which a more reactive element displaces a less reactive element from a solution of its compound", "The gain of oxygen by an element or compound"], "correct": 2, "explanation": "A reaction in which a more reactive element displaces a less reactive element from a solution of its compound"}, {"id": "term_13", "type": "mcq", "question": "What is the definition of <b>OIL RIG</b>?", "options": ["A change in the physical properties or state of a substance that does not involve the formation of a new substance; usually easy to reverse", "The loss of oxygen from a compound", "A substance that increases the rate of a chemical reaction but remains chemically unchanged at the end", "Oxidation Is Loss, Reduction Is Gain (of electrons)"], "correct": 3, "explanation": "Oxidation Is Loss, Reduction Is Gain (of electrons)"}, {"id": "term_14", "type": "mcq", "question": "What is the definition of <b>Oxidation number</b>?", "options": ["A measure of how fast a reaction takes place", "The gain of oxygen by an element or compound", "The charge (or effective charge) on an element in a compound; shown by Roman numerals for transition metals", "The loss of electrons by an atom, ion, or molecule"], "correct": 2, "explanation": "The charge (or effective charge) on an element in a compound; shown by Roman numerals for transition metals"}], "freeform": [], "truefalse": [{"id": "tf_0", "type": "truefalse", "statement": "C6.01 Physical and chemical changes \u2014 Understanding the key differences between physical and chemical changes, with examples of each.", "correct": true, "explanation": "C6.01 Physical and chemical changes \u2014 Understanding the key differences between physical and chemical changes, with examples of each."}, {"id": "tf_1", "type": "truefalse", "statement": "Examples of physical changes:", "correct": true, "explanation": "Examples of physical changes:"}, {"id": "tf_2", "type": "truefalse", "statement": "Examples of chemical changes:", "correct": true, "explanation": "Examples of chemical changes:"}, {"id": "tf_3", "type": "truefalse", "statement": "Five factors that affect the rate of a reaction:", "correct": true, "explanation": "Five factors that affect the rate of a reaction:"}, {"id": "tf_4", "type": "truefalse", "statement": "Classic experiment: Marble chips + hydrochloric acid", "correct": true, "explanation": "Classic experiment: Marble chips + hydrochloric acid"}, {"id": "tf_5", "type": "truefalse", "statement": "Equation: CaCO\u2083(s) + 2HCl(aq) \u2192 CaCl\u2082(aq) + H\u2082O(l) + CO\u2082(g)", "correct": true, "explanation": "Equation: CaCO\u2083(s) + 2HCl(aq) \u2192 CaCl\u2082(aq) + H\u2082O(l) + CO\u2082(g)"}, {"id": "tf_6", "type": "truefalse", "statement": "Method: Place marble chips (calcium carbonate) on a balance with a flask of dilute hydrochloric acid. As CO\u2082 escapes, the mass decreases over time.", "correct": true, "explanation": "Method: Place marble chips (calcium carbonate) on a balance with a flask of dilute hydrochloric acid. As CO\u2082 escapes, the mass decreases over time."}, {"id": "tf_7", "type": "truefalse", "statement": "Compare: Use the same mass of large marble chips (Curve A) vs. small marble chips (Curve B).", "correct": true, "explanation": "Compare: Use the same mass of large marble chips (Curve A) vs. small marble chips (Curve B)."}, {"id": "tf_8", "type": "truefalse", "statement": "Classic experiment: Marble chips + different concentrations of acid", "correct": true, "explanation": "Classic experiment: Marble chips + different concentrations of acid"}, {"id": "tf_9", "type": "truefalse", "statement": "Method: Collect the CO\u2082 gas produced using a gas syringe. Compare dilute acid (Curve C) with more concentrated acid (Curve D).", "correct": true, "explanation": "Method: Collect the CO\u2082 gas produced using a gas syringe. Compare dilute acid (Curve C) with more concentrated acid (Curve D)."}, {"id": "tf_10", "type": "truefalse", "statement": "Result: The more concentrated acid produces gas faster \u2014 the curve is steeper.", "correct": true, "explanation": "Result: The more concentrated acid produces gas faster \u2014 the curve is steeper."}, {"id": "tf_11", "type": "truefalse", "statement": "Graph interpretation (volume of gas vs time):", "correct": true, "explanation": "Graph interpretation (volume of gas vs time):"}, {"id": "tf_12", "type": "truefalse", "statement": "Example: The combustion of fuel inside a car engine cylinder. The piston compresses the fuel-air mixture before the spark plug ignites it, making the explosion more powerful and efficient.", "correct": true, "explanation": "Example: The combustion of fuel inside a car engine cylinder. The piston compresses the fuel-air mixture before the spark plug ignites it, making the explosion more powerful and efficient."}, {"id": "tf_13", "type": "truefalse", "statement": "Classic experiment: Sodium thiosulfate + hydrochloric acid (disappearing cross)", "correct": true, "explanation": "Classic experiment: Sodium thiosulfate + hydrochloric acid (disappearing cross)"}, {"id": "tf_14", "type": "truefalse", "statement": "Equation: Na\u2082S\u2082O\u2083(aq) + 2HCl(aq) \u2192 2NaCl(aq) + S(s) + SO\u2082(g) + H\u2082O(l)", "correct": true, "explanation": "Equation: Na\u2082S\u2082O\u2083(aq) + 2HCl(aq) \u2192 2NaCl(aq) + S(s) + SO\u2082(g) + H\u2082O(l)"}]};
let allQ = [];
let idx = 0;
let score = 0;
let answered = 0;

function init() {
  allQ = [...(DATA.mcq||[]), ...(DATA.truefalse||[]), ...(DATA.freeform||[])];
  if (!allQ.length) { document.getElementById('scoreDisplay').textContent = 'No questions available.'; return; }
  idx = 0; score = 0; answered = 0;
  renderAll();
  showQuestion(0);
}

function renderAll() {
  const c = document.getElementById('questionsContainer');
  c.innerHTML = '';
  allQ.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'q_' + i;

    let typeLabel = q.type === 'mcq' ? 'Multiple Choice' : q.type === 'truefalse' ? 'True / False' : 'Written Answer';
    let inner = `<div class="q-number">Question ${i+1} of ${allQ.length}</div>`;
    inner += `<span class="q-type">${typeLabel}</span>`;

    if (q.type === 'mcq') {
      inner += `<div class="q-text">${q.question}</div>`;
      q.options.forEach((o, oi) => {
        inner += `<button class="option" data-qi="${i}" data-oi="${oi}" onclick="answerMCQ(${i},${oi})">${o}</button>`;
      });
      inner += `<div class="explanation" id="expl_${i}">${q.explanation||''}</div>`;
    } else if (q.type === 'truefalse') {
      inner += `<div class="q-text">${q.statement}</div>`;
      inner += `<div class="tf-btns"><button data-qi="${i}" data-val="true" onclick="answerTF(${i},true)">True</button>`;
      inner += `<button data-qi="${i}" data-val="false" onclick="answerTF(${i},false)">False</button></div>`;
      inner += `<div class="explanation" id="expl_${i}">Correct statement: ${q.explanation||''}</div>`;
    } else {
      inner += `<div class="q-text">${q.question}</div>`;
      inner += `<textarea class="freeform-area" id="ans_${i}" placeholder="Type your answer..."></textarea>`;
      inner += `<div class="explanation" id="expl_${i}"><b>Model answer:</b> ${q.answer||''}</div>`;
    }

    inner += `<div class="nav-btns">`;
    if (q.type === 'freeform') inner += `<button class="btn-reveal" onclick="revealFreeform(${i})">Show Answer</button>`;
    else inner += `<span></span>`;
    inner += `<button class="btn-next" id="next_${i}" onclick="nextQ()">${i===allQ.length-1?'Finish':'Next →'}</button>`;
    inner += `</div>`;

    card.innerHTML = inner;
    c.appendChild(card);
  });
}

function showQuestion(n) {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('q_' + n);
  if (card) card.classList.add('active');
  document.getElementById('progressFill').style.width = ((n+1)/allQ.length*100) + '%';
  document.getElementById('scoreDisplay').textContent = `Question ${n+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerMCQ(qi, oi) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => { b.disabled = true; b.classList.remove('selected'); });
  btns[oi].classList.add('selected');
  if (oi === q.correct) { btns[oi].classList.add('correct'); score++; }
  else { btns[oi].classList.add('wrong'); btns[q.correct].classList.add('correct'); }
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function answerTF(qi, val) {
  const q = allQ[qi];
  const btns = document.querySelectorAll(`button[data-qi="${qi}"]`);
  btns.forEach(b => b.disabled = true);
  const correct = val === q.correct;
  btns.forEach(b => {
    if (String(b.dataset.val) === String(q.correct)) b.classList.add('correct');
    if (b.dataset.val === String(val) && !correct) b.classList.add('wrong');
  });
  if (correct) score++;
  answered++;
  document.getElementById('expl_' + qi).classList.add('show');
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function revealFreeform(qi) {
  document.getElementById('expl_' + qi).classList.add('show');
  answered++;
  document.getElementById('scoreDisplay').textContent = `Question ${qi+1} of ${allQ.length} · Score: ${score}/${answered}`;
}

function nextQ() {
  idx++;
  if (idx >= allQ.length) { showResults(); return; }
  showQuestion(idx);
}

function showResults() {
  document.querySelectorAll('.question-card').forEach(c => c.classList.remove('active'));
  const pct = answered > 0 ? Math.round(score/answered*100) : 0;
  document.getElementById('finalScore').textContent = pct + '%';
  let grade = pct >= 90 ? 'Outstanding!' : pct >= 70 ? 'Great work!' : pct >= 50 ? 'Good effort — keep studying!' : 'Review the material and try again.';
  document.getElementById('gradeText').textContent = grade + ` (${score}/${answered} correct)`;
  document.getElementById('resultsCard').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';
  // Save to localStorage for dashboard
  try {
    const sessions = JSON.parse(localStorage.getItem('sf_quiz_sessions') || '[]');
    sessions.push({ date: new Date().toISOString(), score, total: answered, pct });
    localStorage.setItem('sf_quiz_sessions', JSON.stringify(sessions));
  } catch(e) {}
}

function restart() {
  document.getElementById('resultsCard').style.display = 'none';
  init();
}

init();
</script>
</body>
</html>
